<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<text y='.9em' font-size='90'>👁️</text>
</svg>">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOOK — Phrasal Verbs</title>

<style>
:root{
  --c1:#0a1025;
  --c2:#00b4ff;
  --c3:#8232ff;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  width:100vw;height:100vh;overflow:hidden;
  font-family:Arial, sans-serif;color:#fff;
  background:
    radial-gradient(circle at 15% 15%, rgba(0,180,255,.22), transparent 28%),
    radial-gradient(circle at 85% 25%, rgba(130,50,255,.25), transparent 30%),
    radial-gradient(circle at 50% 100%, rgba(0,255,210,.12), transparent 35%),
    linear-gradient(135deg,#040611,#0a1025,#050816);
}

/* background — no animation, just soft static glows */
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none;}
.orb1{width:300px;height:300px;background:#008cff;top:-100px;left:-80px;}
.orb2{width:350px;height:350px;background:#7b00ff;right:-120px;top:20%;}
.orb3{width:250px;height:250px;background:#00e5ff;bottom:-100px;left:35%;}

.grid{position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size:50px 50px;pointer-events:none;}

/* title — static gradient text, no animation */
.title{position:fixed;top:20px;left:50%;transform:translateX(-50%);text-align:center;z-index:100;}
.title h1{
  font-size:42px;
  background:linear-gradient(90deg,#ffffff,#60ddff,#a66cff,#ffffff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.title p{margin-top:6px;color:rgba(255,255,255,.5);letter-spacing:2px;font-size:12px;}

#workspace{position:absolute;inset:0;}
#connections{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;}
.node{
  position:absolute;
  min-width:95px;
  min-height:48px;
  padding:9px 14px;
  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.16);
  border-radius:14px;
  backdrop-filter:blur(14px);

  box-shadow:
    0 10px 30px rgba(0,0,0,.3),
    inset 0 1px 0 rgba(255,255,255,.1);

  cursor:grab;
  user-select:none;
  z-index:10;

  transition:
    transform .15s,
    box-shadow .15s;
}

.node:hover{
  box-shadow:
    0 0 25px rgba(0,200,255,.22),
    0 10px 30px rgba(0,0,0,.4);
}

.node.dragging{
  cursor:grabbing;
  transform:scale(1.08);
}

.main-node{
  min-width:150px;
  min-height:70px;
  border-color:rgba(70,220,255,.5);
  box-shadow:
    0 0 35px rgba(0,190,255,.15),
    0 15px 45px rgba(0,0,0,.45);
}

.main-node .word{
  font-size:28px;
}

.word{
  font-size:15px;
  font-weight:700;
  white-space:nowrap;
  text-align:center;
}

.port{
  position:absolute;
  width:11px;
  height:11px;
  border-radius:50%;
  background:#4ddfff;
  border:2px solid rgba(255,255,255,.85);

  box-shadow:
    0 0 8px #00cfff,
    0 0 18px #00cfff;

  cursor:crosshair;
  z-index:20;
}

.port.left{
  left:-6px;
  top:50%;
  transform:translateY(-50%);
}

.port.right{
  right:-6px;
  top:50%;
  transform:translateY(-50%);
}

.port:hover{
  background:#fff;
  transform:translateY(-50%) scale(1.35);
}


/* explanation panel — static border, no rotation */
.explanation{
  position:fixed;right:30px;bottom:30px;width:340px;min-height:250px;padding:22px;
  background:rgba(10,18,40,.75);border:1px solid rgba(100,220,255,.28);
  border-radius:26px;backdrop-filter:blur(25px);
  box-shadow:0 25px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
  z-index:80;overflow:hidden;
}

/* EYE — the single animation in this page (blink) */
.eye{width:105px;height:64px;margin:0 auto 16px;position:relative;background:#fff;
  border-radius:80% 20% 80% 20% / 70% 30% 70% 30%;
  box-shadow:0 0 25px rgba(0,220,255,.35);overflow:hidden;}
.iris{position:absolute;width:38px;height:38px;left:50%;top:50%;transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,#111 0 20%,#168dff 21% 45%,#052b5c 46% 70%,#111 71%);
  transition:transform .08s linear;}
.iris::after{content:"";position:absolute;width:9px;height:9px;background:#fff;border-radius:50%;top:6px;left:8px;opacity:.9;}
.eyelid{position:absolute;left:-10%;width:120%;height:32px;background:#091126;z-index:5;
  animation:blink 5s infinite;}
.eyelid.top{top:-28px;border-radius:0 0 50% 50%;}
.eyelid.bottom{bottom:-28px;border-radius:50% 50% 0 0;}
@keyframes blink{
  0%,45%,48%,100%{transform:translateY(0);}
  46%,47%{transform:translateY(26px);}
}
.eye-emoji{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:26px;opacity:0;transition:opacity .25s;pointer-events:none;
}
.eye-emoji.show{opacity:1;}
.eye.emoji-mode .iris{opacity:0;}

.explanation h2{text-align:center;font-size:21px;margin-bottom:9px;}
.explanation p{text-align:center;color:rgba(255,255,255,.65);line-height:1.5;font-size:14px;}
.example{margin-top:14px;padding:11px;text-align:center;border-radius:12px;
  background:rgba(0,200,255,.07);color:#70e5ff;font-weight:bold;font-size:14px;}
.reroll{display:block;margin:10px auto 0;padding:6px 14px;border-radius:10px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  color:#cdeeff;font-size:12px;cursor:pointer;}
.reroll:hover{background:rgba(255,255,255,.16);}

.help{position:fixed;left:30px;bottom:30px;padding:12px 16px;border-radius:14px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.5);backdrop-filter:blur(15px);z-index:90;font-size:12px;max-width:230px;}

/* TEST button + panel */
.test-btn{position:fixed;top:22px;right:30px;z-index:100;
  padding:11px 20px;border-radius:14px;
  background:linear-gradient(90deg,#00b4ff,#8232ff);
  border:none;color:#fff;font-weight:bold;font-size:14px;cursor:pointer;
  box-shadow:0 10px 30px rgba(0,150,255,.35);}
.test-btn:hover{filter:brightness(1.1);}

.quiz-overlay{
  position:fixed;inset:0;background:rgba(4,6,17,.82);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:200;
}
.quiz-overlay.show{display:flex;}
.quiz-box{
  width:420px;max-width:90vw;padding:30px;border-radius:24px;
  background:rgba(10,18,40,.92);border:1px solid rgba(100,220,255,.3);
  box-shadow:0 30px 90px rgba(0,0,0,.55);
  text-align:center;
}
.quiz-box h3{font-size:14px;letter-spacing:2px;color:#70e5ff;margin-bottom:6px;}
.quiz-score{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:16px;}
.quiz-question{font-size:16px;line-height:1.5;margin-bottom:20px;min-height:60px;}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.quiz-opt{
  padding:12px 8px;border-radius:12px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);color:#fff;font-weight:bold;cursor:pointer;font-size:14px;
}
.quiz-opt:hover{background:rgba(0,180,255,.15);}
.quiz-opt.correct{background:rgba(60,220,120,.35);border-color:#3cdc78;}
.quiz-opt.wrong{background:rgba(255,80,80,.3);border-color:#ff5050;}
.quiz-footer{display:flex;justify-content:space-between;align-items:center;}
.quiz-close{background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;font-size:13px;}
.quiz-next{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:#fff;padding:8px 16px;border-radius:10px;cursor:pointer;font-size:13px;display:none;}
.quiz-next.show{display:inline-block;}
@media (max-width: 700px){

  body{
    overflow:auto;
    min-width:0;
  }

  .title{
    top:12px;
  }

  .title h1{
    font-size:28px;
  }

  .title p{
    font-size:9px;
    letter-spacing:1px;
  }

  .test-btn{
    top:65px;
    right:12px;
    padding:8px 12px;
    font-size:11px;
  }

  #workspace{
    position:absolute;
    top:110px;
    left:0;
    width:900px;
    height:900px;
  }

  .node{
    min-width:75px;
    min-height:40px;
    padding:7px 10px;
    border-radius:11px;
  }

  .node .word{
    font-size:12px;
  }

  .main-node{
    min-width:110px;
    min-height:55px;
  }

  .main-node .word{
    font-size:22px;
  }

  .port{
    width:9px;
    height:9px;
  }

  .explanation{
    position:fixed;
    left:10px;
    right:10px;
    bottom:10px;
    width:auto;
    min-height:190px;
    padding:14px;
    border-radius:18px;
  }

  .eye{
    width:75px;
    height:45px;
    margin-bottom:8px;
  }

  .iris{
    width:27px;
    height:27px;
  }

  .explanation h2{
    font-size:17px;
  }

  .explanation p{
    font-size:12px;
  }

  .example{
    margin-top:8px;
    padding:8px;
    font-size:12px;
  }

  .help{
    display:none;
  }

  .quiz-box{
    width:calc(100vw - 30px);
    padding:20px;
  }
}
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="grid"></div>

<div class="title">
  <h1 id="titleWord">LOOK</h1>
  <p>PHRASAL VERBS • PREFIXES</p>
</div>

<button class="test-btn" id="testBtn">🧪 Test yourself</button>

<div id="workspace">
  <svg id="connections"></svg>

  <div class="node word-node" id="wordNode" style="left:18%;top:40%;">
    <div class="port right"></div>
    <div class="word">WORD<span class="emoji-tag">✨ just for fun</span></div>
  </div>

  <div class="node main-node" id="lookNode" style="left:42%;top:38%;">
    <div class="port left"></div>
    <div class="word">LOOK</div>
    <div class="port right"></div>
  </div>
</div>

<div class="explanation">
  <div class="eye" id="eyeBox">
    <div class="eyelid top"></div>
    <div class="iris" id="iris"></div>
    <div class="eyelid bottom"></div>
    <div class="eye-emoji" id="eyeEmoji"></div>
  </div>

  <h2 id="explanationTitle">👁️ How it works</h2>
  <p id="explanationText">Connect LOOK with a word to create a phrasal verb.</p>
  <div class="example" id="example">LOOK + ?</div>
  <button class="reroll" id="rerollBtn" style="display:none;">🎲 another example</button>
</div>

<div class="help">Drag blocks • Connect nodes • Double-click a line to remove</div>

<!-- QUIZ OVERLAY -->
<div class="quiz-overlay" id="quizOverlay">
  <div class="quiz-box">
    <h3>QUICK TEST</h3>
    <div class="quiz-score" id="quizScore">Score: 0 / 0</div>
    <div class="quiz-question" id="quizQuestion">Loading…</div>
    <div class="quiz-options" id="quizOptions"></div>
    <div class="quiz-footer">
      <button class="quiz-close" id="quizClose">✕ close</button>
      <button class="quiz-next" id="quizNext">Next →</button>
    </div>
  </div>
</div>

<script>
/* =====================================================
   ELEMENTS
===================================================== */
const workspace = document.getElementById("workspace");
const svg = document.getElementById("connections");
const titleWord = document.getElementById("titleWord");
const lookNode = document.getElementById("lookNode");
const wordNode = document.getElementById("wordNode");
const iris = document.getElementById("iris");
const eyeBox = document.getElementById("eyeBox");
const eyeEmoji = document.getElementById("eyeEmoji");
const explanationTitle = document.getElementById("explanationTitle");
const explanationText = document.getElementById("explanationText");
const example = document.getElementById("example");
const rerollBtn = document.getElementById("rerollBtn");

/* =====================================================
   STATE
===================================================== */
let connections = [];
let dragging = null;
let offsetX = 0, offsetY = 0;
let connecting = null;

/* =====================================================
   DATA — phrasal verbs, prepositions & prefixes
   each entry has several example sentences,
   a random one is shown / re-rolled on demand
===================================================== */
const explanations = {
  "AT":       { title:"LOOK AT 👀",      emoji:"👀", text:"To direct your eyes toward someone or something.",
                examples:["LOOK AT the picture on the wall.","She looked at him and smiled.","Look at this mess!"] },
  "FOR":      { title:"LOOK FOR 🔎",     emoji:"🔎", text:"To try to find someone or something.",
                examples:["I am LOOKING FOR my keys.","We looked for a hotel all evening.","He's looking for a new job."] },
  "AFTER":    { title:"LOOK AFTER 🛡️",  emoji:"🛡️", text:"To take care of someone or something.",
                examples:["She LOOKS AFTER her little brother.","Can you look after the dog this weekend?","He looks after the garden."] },
  "UP":       { title:"LOOK UP ⬆️",      emoji:"⬆️", text:"To search for information, or to glance toward a higher place.",
                examples:["LOOK UP the word in a dictionary.","He looked up at the sky.","Let's look up the schedule online."] },
  "OUT":      { title:"LOOK OUT ⚠️",     emoji:"⚠️", text:"To be careful or watch for danger.",
                examples:["LOOK OUT! There's a car coming!","Look out for icy patches on the road.","He shouted a warning to look out."] },
  "IN":       { title:"LOOK IN 🔍",      emoji:"🔍", text:"To pay a short visit, or to peek inside something.",
                examples:["I'll LOOK IN on grandma later.","Look in the box before you throw it away.","The doctor looked in to check on the patient."] },
  "BACK":     { title:"LOOK BACK 🔙",    emoji:"🔙", text:"To think about something that happened in the past.",
                examples:["He LOOKED BACK on his childhood.","Looking back, it was a great decision.","She never looks back with regret."] },
  "AROUND":   { title:"LOOK AROUND 🔄",  emoji:"🔄", text:"To glance in different directions or explore a place.",
                examples:["LOOK AROUND the room for clues.","We looked around the museum for hours.","Just looking around, thanks!"] },
  "THROUGH":  { title:"LOOK THROUGH 📖", emoji:"📖", text:"To examine something carefully, page by page or item by item.",
                examples:["LOOK THROUGH the book for the answer.","She looked through her old photos.","Let's look through the report together."] },
  "INTO":     { title:"LOOK INTO 🕵️",   emoji:"🕵️", text:"To investigate or examine something carefully.",
                examples:["We will LOOK INTO the problem.","Police are looking into the incident.","I'll look into cheaper flights."] },
  "OVER":     { title:"LOOK OVER 📝",    emoji:"📝", text:"To examine or check something quickly.",
                examples:["LOOK OVER your homework before class.","Could you look over this contract?","He looked over the notes one last time."] },
  "DOWN":     { title:"LOOK DOWN ⬇️",    emoji:"⬇️", text:"To glance toward a lower place — or (with 'on') to think you're better than someone.",
                examples:["She LOOKED DOWN and saw the drop below.","Don't look down on people less lucky than you.","He looked down at his shoes."] },
  "ON":       { title:"LOOK ON 👥",      emoji:"👥", text:"To watch something happen without taking part.",
                examples:["The crowd LOOKED ON in silence.","He just looked on while others worked.","We looked on as the parade passed."] },
  "FORWARD TO":{ title:"LOOK FORWARD TO 🤩", emoji:"🤩", text:"To feel excited about something that will happen.",
                examples:["I'm LOOKING FORWARD TO the holidays.","We look forward to hearing from you.","She's looking forward to the trip."] },
  "UP TO":    { title:"LOOK UP TO 🌟",   emoji:"🌟", text:"To admire and respect someone.",
                examples:["Kids LOOK UP TO their parents.","He has always looked up to his coach.","I look up to her a lot."] },
  "OUT FOR":  { title:"LOOK OUT FOR 🎯", emoji:"🎯", text:"To watch for something specific, or to protect someone's interests.",
                examples:["LOOK OUT FOR the blue sign.","A good friend looks out for you.","Keep an eye out for typos."] },

  "RE-":  { title:"RE- 🔁", emoji:"🔁", text:"The prefix RE- often means doing something again.",
            examples:["RE + WRITE = REWRITE","RE + BUILD = REBUILD","RE + READ = REREAD"] },
  "OVER-":{ title:"OVER- 📈", emoji:"📈", text:"The prefix OVER- can indicate excess or going beyond a limit.",
            examples:["OVER + COOK = OVERCOOK","OVER + SLEEP = OVERSLEEP","OVER + THINK = OVERTHINK"] },
  "MIS-": { title:"MIS- ❌", emoji:"❌", text:"The prefix MIS- often indicates something done incorrectly.",
            examples:["MIS + UNDERSTAND = MISUNDERSTAND","MIS + SPELL = MISSPELL","MIS + LEAD = MISLEAD"] },
  "EN-":  { title:"EN- ✨", emoji:"✨", text:"The prefix EN- can form verbs meaning to cause or put into a state.",
            examples:["EN + LARGE = ENLARGE","EN + COURAGE = ENCOURAGE","EN + ABLE = ENABLE"] },
  "DIS-": { title:"DIS- 🚫", emoji:"🚫", text:"The prefix DIS- can indicate separation, removal, or the opposite.",
            examples:["DIS + CONNECT = DISCONNECT","DIS + AGREE = DISAGREE","DIS + APPEAR = DISAPPEAR"] },
  "DE-":  { title:"DE- 🔽", emoji:"🔽", text:"The prefix DE- can indicate removal, reversal, or reduction.",
            examples:["DE + ACTIVATE = DEACTIVATE","DE + CODE = DECODE","DE + FROST = DEFROST"] },
  "UN-":  { title:"UN- 🔓", emoji:"🔓", text:"The prefix UN- usually reverses an action or shows a negative.",
            examples:["UN + LOCK = UNLOCK","UN + HAPPY = UNHAPPY","UN + TIE = UNTIE"] },
  "PRE-": { title:"PRE- ⏮️", emoji:"⏮️", text:"The prefix PRE- means before.",
            examples:["PRE + VIEW = PREVIEW","PRE + HEAT = PREHEAT","PRE + PAY = PREPAY"] }
};

const decorativeWords = new Set(["RE-","OVER-","MIS-","EN-","DIS-","DE-","UN-","PRE-"]); // prefixes get "PREFIX+WORD" formatting

/* =====================================================
   CREATE NODE
===================================================== */
function createNode(word, x, y) {
  const node = document.createElement("div");
  node.className = "node";
  node.style.left = x + "px";
  node.style.top = y + "px";
  node.dataset.word = word;
  node.innerHTML = `
    <div class="port left"></div>
    <div class="word">${word}</div>
    <div class="port right"></div>
  `;
  workspace.appendChild(node);
  setupNode(node);
  return node;
}

/* =====================================================
   NODE SETUP
===================================================== */
function setupNode(node) {
  node.addEventListener("mousedown", e => {
    if (e.target.classList.contains("port")) return;
    dragging = node;
    const rect = node.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    node.classList.add("dragging");
  });

  node.querySelectorAll(".port").forEach(port => {
    port.addEventListener("mousedown", e => {
      e.stopPropagation();
      connecting = { node, port };
    });
  });
}
setupNode(lookNode);
setupNode(wordNode);

/* =====================================================
   MOUSE MOVE / UP
===================================================== */
document.addEventListener("mousemove", e => {
  if (dragging) {
    const rect = workspace.getBoundingClientRect();
    dragging.style.left = (e.clientX - rect.left - offsetX) + "px";
    dragging.style.top = (e.clientY - rect.top - offsetY) + "px";
    drawConnections();
  }
  if (connecting) drawConnections(e.clientX, e.clientY);
});

document.addEventListener("mouseup", e => {
  if (dragging) { dragging.classList.remove("dragging"); dragging = null; }

  if (connecting) {
    const element = document.elementFromPoint(e.clientX, e.clientY);
    const target = element?.closest(".port");
    if (target) tryConnect(connecting.node, target.parentElement);
    connecting = null;
    drawConnections();
  }
});

/* =====================================================
   CONNECT
===================================================== */
function tryConnect(from, to) {
  if (from === to) return;

  let other = null;

  if (from === lookNode) {
    other = to;
  } else if (to === lookNode) {
    other = from;
  } else {
    return;
  }

  // Нельзя подключать LOOK к самому себе
  if (other === lookNode) return;

  // Если уже соединены — ничего не делаем
  const alreadyConnected = connections.some(
    c => c.node === other
  );

  if (alreadyConnected) return;

  // Добавляем новое соединение
  connections.push({
    node: other,
    word: other.dataset.word
  });

  updateWords();
  drawConnections();
}

/* =====================================================
   UPDATE WORD / EXPLANATION
===================================================== */
function pickExample(word) {
  const info = explanations[word];
  if (!info) return null;
  return info.examples[Math.floor(Math.random() * info.examples.length)];
}

function showEmojiInEye(emoji) {
  eyeEmoji.textContent = emoji || "";
  if (emoji) {
    eyeBox.classList.add("emoji-mode");
    eyeEmoji.classList.add("show");
  } else {
    eyeBox.classList.remove("emoji-mode");
    eyeEmoji.classList.remove("show");
  }
}

function updateWords() {

  if (connections.length === 0) {
    titleWord.textContent = "LOOK";

    explanationTitle.textContent = "👁️ How it works";
    explanationText.textContent =
      "Connect LOOK with one or more words to create phrasal verbs.";

    example.textContent = "LOOK + ?";
    rerollBtn.style.display = "none";

    showEmojiInEye("");
    return;
  }

  // Берём последнее подключение
  const connection = connections[connections.length - 1];
  const word = connection.word;

  if (word === "WORD") {
    titleWord.textContent = "LOOK ✨ WORD";

    explanationTitle.textContent = "✨ Just for looks!";
    explanationText.textContent =
      "WORD doesn't form a real phrase with LOOK — this link is just here for fun.";

    example.textContent = "LOOK ✨ WORD";
    rerollBtn.style.display = "none";

    showEmojiInEye("🎨");
    return;
  }

  const info = explanations[word];

  const fullWord =
    decorativeWords.has(word)
      ? word + " + WORD"
      : "LOOK " + word;

  titleWord.textContent = fullWord;

  if (info) {

    explanationTitle.textContent = info.title;
    explanationText.textContent = info.text;

    example.textContent = pickExample(word);

    rerollBtn.style.display = "inline-block";

    showEmojiInEye(info.emoji);

  } else {

    explanationTitle.textContent = fullWord;
    explanationText.textContent =
      "This combination creates a new expression.";

    example.textContent = fullWord;

    rerollBtn.style.display = "none";

    showEmojiInEye("");
  }
}

rerollBtn.addEventListener("click", () => {

  if (connections.length === 0) return;

  const connection =
    connections[connections.length - 1];

  if (explanations[connection.word]) {
    example.textContent =
      pickExample(connection.word);
  }

});

/* =====================================================
   DELETE CONNECTION
===================================================== */
function deleteConnection() {
  connection = null;
  titleWord.textContent = "LOOK";
  explanationTitle.textContent = "👁️ How it works";
  explanationText.textContent = "Connect LOOK with a word to create a phrasal verb.";
  example.textContent = "LOOK + ?";
  rerollBtn.style.display = "none";
  showEmojiInEye("");
  drawConnections();
}

/* =====================================================
   DRAW
===================================================== */
function drawConnections(mouseX, mouseY) {

  svg.innerHTML = "";

  // Рисуем все соединения
  connections.forEach((connection, index) => {

    const line = drawLine(lookNode, connection.node);

    line.addEventListener("dblclick", function(e) {
      e.stopPropagation();

      // Удаляем именно это соединение
      connections.splice(index, 1);

      updateWords();
      drawConnections();
    });

  });

  // Временная линия во время подключения
  if (connecting && mouseX !== undefined) {

    const rect = connecting.port.getBoundingClientRect();

    drawTemporaryLine(
      rect.left + rect.width / 2,
      rect.top + rect.height / 2,
      mouseX,
      mouseY
    );
  }
}

function drawLine(a, b) {
  const ra = a.getBoundingClientRect();
  const rb = b.getBoundingClientRect();
  let x1,y1,x2,y2;

  if (ra.left < rb.left) {
    x1 = ra.right; y1 = ra.top + ra.height/2;
    x2 = rb.left;  y2 = rb.top + rb.height/2;
  } else {
    x1 = ra.left;  y1 = ra.top + ra.height/2;
    x2 = rb.right; y2 = rb.top + rb.height/2;
  }

  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("x1", x1); line.setAttribute("y1", y1);
  line.setAttribute("x2", x2); line.setAttribute("y2", y2);
  line.setAttribute("stroke", "rgba(80,220,255,.9)");
  line.setAttribute("stroke-width", "4");
  line.setAttribute("stroke-linecap", "round");
  line.style.pointerEvents = "stroke";
  line.style.cursor = "pointer";
  svg.appendChild(line);
  return line;
}

function drawTemporaryLine(x1,y1,x2,y2) {
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("x1", x1); line.setAttribute("y1", y1);
  line.setAttribute("x2", x2); line.setAttribute("y2", y2);
  line.setAttribute("stroke", "rgba(255,255,255,.5)");
  line.setAttribute("stroke-width", "3");
  line.setAttribute("stroke-dasharray", "8 8");
  svg.appendChild(line);
}

/* =====================================================
   PLACE WORD NODES ON THE BOARD
===================================================== */
const layout = [
  ["AT",720,120],["FOR",720,230],["AFTER",720,340],["UP",720,450],["DOWN",720,560],
  ["OUT",950,120],["IN",950,230],["BACK",950,340],["AROUND",950,450],["ON",950,560],
  ["THROUGH",1180,120],["INTO",1180,230],["OVER",1180,340],["OUT FOR",1180,450],["UP TO",1180,560],
  ["FORWARD TO",1410,120],

];
layout.forEach(([w,x,y]) => createNode(w, x, y));

/* =====================================================
   EYE FOLLOWS MOUSE (part of the single blink animation area,
   this is just a CSS transform driven by JS, not a keyframe animation)
===================================================== */
document.addEventListener("mousemove", e => {
  const rect = iris.parentElement.getBoundingClientRect();
  const centerX = rect.left + rect.width/2;
  const centerY = rect.top + rect.height/2;
  let dx = e.clientX - centerX;
  let dy = e.clientY - centerY;
  const distance = Math.sqrt(dx*dx + dy*dy);
  const max = 13;
  if (distance > max) { dx = dx/distance*max; dy = dy/distance*max; }
  iris.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
});

/* =====================================================
   RESIZE
===================================================== */
window.addEventListener("resize", () => drawConnections());

/* =====================================================
   QUIZ / TEST MODE
===================================================== */
const testBtn = document.getElementById("testBtn");
const quizOverlay = document.getElementById("quizOverlay");
const quizQuestion = document.getElementById("quizQuestion");
const quizOptions = document.getElementById("quizOptions");
const quizScore = document.getElementById("quizScore");
const quizClose = document.getElementById("quizClose");
const quizNext = document.getElementById("quizNext");

const quizWords = Object.keys(explanations);
let score = 0, asked = 0, currentAnswer = "";

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function newQuestion() {
  quizNext.classList.remove("show");
  const word = quizWords[Math.floor(Math.random() * quizWords.length)];
  currentAnswer = word;
  const info = explanations[word];
  const sentence = pickExample(word) || info.examples[0];
  const blanked = decorativeWords.has(word)
    ? `Which prefix fits? ${info.emoji} "${info.text}"`
    : sentence.replace(new RegExp("LOOK\\s+" + word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), "i"), "LOOK ___");

  quizQuestion.textContent = blanked;

  const distractors = shuffle(quizWords.filter(w => w !== word)).slice(0, 3);
  const options = shuffle([word, ...distractors]);

  quizOptions.innerHTML = "";
  options.forEach(opt => {
    const btn = document.createElement("div");
    btn.className = "quiz-opt";
    btn.textContent = opt;
    btn.addEventListener("click", () => selectAnswer(btn, opt));
    quizOptions.appendChild(btn);
  });
}

function selectAnswer(btn, opt) {
  document.querySelectorAll(".quiz-opt").forEach(b => b.style.pointerEvents = "none");
  asked++;
  if (opt === currentAnswer) {
    score++;
    btn.classList.add("correct");
  } else {
    btn.classList.add("wrong");
    document.querySelectorAll(".quiz-opt").forEach(b => {
      if (b.textContent === currentAnswer) b.classList.add("correct");
    });
  }
  quizScore.textContent = `Score: ${score} / ${asked}`;
  quizNext.classList.add("show");
}

testBtn.addEventListener("click", () => {
  quizOverlay.classList.add("show");
  newQuestion();
});
quizClose.addEventListener("click", () => quizOverlay.classList.remove("show"));
quizNext.addEventListener("click", newQuestion);
</script>
